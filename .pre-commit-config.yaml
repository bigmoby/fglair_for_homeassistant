default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
        files: ^((custom_components|tests)/.+)?[^/]+\.(py|pyi)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ["--unsafe"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
  - repo: local
    hooks:
      # Runs in the project environment so Home Assistant and pytest types are
      # resolved: an isolated hook env would see them as Any.
      - id: mypy
        name: mypy
        entry: python3 -m mypy --strict custom_components tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: python3 -m pytest tests/ -v
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-coverage
        name: pytest-coverage
        entry: python3 -m pytest tests/ -v --cov=custom_components.fglair_heatpump_controller --cov-report=term-missing --cov-fail-under=100
        language: system
        pass_filenames: false
        always_run: true
